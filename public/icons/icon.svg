<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512">
  <defs>
    <linearGradient id="bgGradient" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#3b82f6"/>
      <stop offset="50%" style="stop-color:#6366f1"/>
      <stop offset="100%" style="stop-color:#8b5cf6"/>
    </linearGradient>
  </defs>
  
  <!-- Background with rounded corners for maskable icons -->
  <rect x="0" y="0" width="512" height="512" rx="0" ry="0" fill="url(#bgGradient)"/>
  
  <!-- Shopping bag icon -->
  <g>
    <!-- Bag body -->
    <rect x="140" y="210" width="232" height="200" rx="25" fill="#ffffff" opacity="0.95"/>
    
    <!-- Bag handle -->
    <path d="M180 210 L180 170 Q180 120 256 120 Q332 120 332 170 L332 210" 
          fill="none" stroke="#ffffff" stroke-width="28" stroke-linecap="round" opacity="0.9"/>
    
    <!-- "O" letter in center -->
    <circle cx="256" cy="310" r="50" fill="none" stroke="#3b82f6" stroke-width="20"/>
    
    <!-- Decorative elements -->
    <circle cx="370" cy="160" r="14" fill="#fbbf24"/>
    <circle cx="142" cy="180" r="10" fill="#34d399"/>
    <circle cx="385" cy="340" r="8" fill="#f472b6"/>
  </g>
</svg>